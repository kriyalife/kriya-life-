<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Forest Green background matching Kríya Life Science dark theme -->
  <rect width="512" height="512" rx="96" fill="#0A271B" />
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#16422F" stroke-width="6" />

  <!-- Centered KRÍYA Brand Logo Elements -->
  <g transform="translate(256, 230) scale(0.82)">
    <!-- === LETTER K === -->
    <path d="M -180 -80 L -150 -80 L -150 40 L -180 40 Z" fill="#FFFFFF"/>
    <path d="M -150 -10 L -40 -80 L -10 -80 L -120 0 Z" fill="#FFFFFF"/>
    <!-- Leaf Accent on K -->
    <path d="M -150 -2 C -190 20 -180 50 -100 55 C -40 55 -30 30 -150 -2 Z" fill="#588126"/>
    <path d="M -150 -2 C -125 25 -90 42 -50 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- === LETTER R === -->
    <path d="M -10 -80 L 20 -80 L 20 40 L -10 40 Z" fill="#FFFFFF"/>
    <path d="M 20 -80 L 70 -80 C 100 -80 115 -62 115 -42 C 115 -22 98 -10 70 -10 L 20 -10 Z M 20 -62 L 20 -28 L 68 -28 C 88 -28 95 -36 95 -45 C 95 -54 88 -62 68 -62 Z" fill="#FFFFFF"/>
    <path d="M 45 -14 L 105 40 L 130 40 L 65 -18 Z" fill="#FFFFFF"/>

    <!-- === LETTER Í === -->
    <path d="M 145 -55 L 170 -55 L 170 40 L 145 40 Z" fill="#FFFFFF"/>
    <!-- Leaf Accent over Í -->
    <path d="M 146 -62 C 146 -62 140 -92 165 -102 C 180 -108 190 -100 190 -100 C 190 -100 185 -78 165 -68 C 156 -64 146 -62 146 -62 Z" fill="#588126"/>
    <path d="M 148 -65 C 162 -82 176 -94 186 -98" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- === LETTER Y === -->
    <path d="M 200 -80 C 230 -80 250 -50 250 -20 L 250 40 L 230 40 L 230 -20 C 230 -38 218 -62 198 -62 Z" fill="#FFFFFF"/>
    <path d="M 320 -80 C 290 -80 270 -50 270 -20 L 270 40 L 290 40 L 290 -20 C 290 -38 302 -62 322 -62 Z" fill="#FFFFFF"/>
    <circle cx="260" cy="-58" r="14" fill="#588126"/>

    <!-- === LETTER A === -->
    <path d="M 365 -80 L 385 -80 L 430 40 L 405 40 L 392 10 L 358 10 L 350 40 L 330 40 Z M 375 -50 L 362 -5 L 388 -5 Z" fill="#FFFFFF"/>
  </g>

  <!-- SUBTITLE "LIFE SCIENCE" -->
  <g transform="translate(256, 380)">
    <line x1="-180" y1="-12" x2="-110" y2="-12" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <text x="0" y="0" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="11" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Times New Roman', serif">LIFE SCIENCE</text>
    <line x1="110" y1="-12" x2="180" y2="-12" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  </g>
