<!DOCTYPE html>
<html>
<head>
  <title>Shop</title>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://ybhvdyrwylkeyirizenc.supabase.co",
      "sb_publishable_TvHcUPQI33Aq4QdYadtI3g_vRHgFA4S"
    );

    async function loadProducts() {
      const res = await fetch("/products"); const data = await res.json();
      const div = document.getElementById("products");
      div.innerHTML = "";

      if(data) {
        data.forEach(p => {
          div.innerHTML += `
            <div style="border:1px solid #ddd; padding:10px; margin:10px; display:inline-block;">
              <img src="${p.image}" width="150" height="150" style="object-fit:cover;"/><br>
              <b>${p.name}</b><br>
              ₹${p.price}<br>
              <button onclick="buy('${p.id}', ${p.price})" style="margin-top:10px;">Buy Now</button>
            </div>
          `;
        });
      }
    }

    window.buy = async (id, price) => {
      const { data: userData } = await supabase.auth.getUser();

      if (!userData.user) {
        alert("Please login first! ❌");
        window.location.href = "auth.html";
        return;
      }

      const res = await fetch("/place-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: id, customer_name: userData.user.email, customer_email: userData.user.id, price })
      });
      const error = res.ok ? null : await res.json();

      if(error) {
        alert("Order failed! ❌");
        console.error(error);
      } else {
        alert("Order Placed ✅");
        window.location.href = "profile.html";
      }
    };

    loadProducts();
  </script>
</head>
<body>

<h2>Shop</h2>
<p>
  <a href="auth.html">Login/Signup</a> | 
  <a href="profile.html">My Profile</a>
</p>
<div id="products"></div>

</body>
</html>
